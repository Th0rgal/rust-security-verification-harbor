schema_version = "1.2"
artifacts = [
  "/workspace/submission/Spec.lean",
  "/workspace/submission/Audit.lean",
  "/workspace/submission/counterexample.json",
  "/workspace/submission/src/lib.rs",
  "/workspace/submission/Proof.lean",
]

[task]
name = "lfglabs/rust-security-overflow-prove-or-refute"
description = "Lean-native specification and symmetric audit with universal Rust checking and independent Lean evidence"
keywords = ["rust", "security", "integer-overflow", "lean4", "prove-or-refute"]
authors = [{ name = "LFG Labs" }]

[metadata]
track = "lean-native-symmetric-v3"
difficulty = "expert"
source_language = "rust"
proof_language = "lean4"
vulnerability_class = "CWE-190"

[agent]
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
workdir = "/workspace"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
