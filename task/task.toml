schema_version = "1.2"
artifacts = [
  "/workspace/submission/Spec.lean",
  "/workspace/submission/Audit.lean",
  "/workspace/submission/counterexample.json",
  "/workspace/submission/Proof.lean",
  "/workspace/submission/src/lib.rs",
  "/workspace/submission/src/constants.rs",
  "/workspace/submission/src/word_math.rs",
  "/workspace/submission/src/reciprocal_div.rs",
  "/workspace/submission/src/broadword_swar.rs",
  "/workspace/submission/src/montgomery_field.rs",
  "/workspace/submission/src/goldilocks_field.rs",
  "/workspace/submission/src/fee_schedule.rs",
  "/workspace/submission/src/liquidity_pool.rs",
  "/workspace/submission/src/transcript_codec.rs",
  "/workspace/submission/src/clearing_pipeline.rs",
  "/workspace/submission/LeanModel/Constants.lean",
  "/workspace/submission/LeanModel/WordMath.lean",
  "/workspace/submission/LeanModel/ReciprocalDiv.lean",
  "/workspace/submission/LeanModel/BroadwordSwar.lean",
  "/workspace/submission/LeanModel/MontgomeryField.lean",
  "/workspace/submission/LeanModel/GoldilocksField.lean",
  "/workspace/submission/LeanModel/FeeSchedule.lean",
  "/workspace/submission/LeanModel/LiquidityPool.lean",
  "/workspace/submission/LeanModel/TranscriptCodec.lean",
  "/workspace/submission/LeanModel/ClearingPipeline.lean",
]

[task]
name = "lfglabs/rust-security-overflow-prove-or-refute"
description = "Lean-native specification and symmetric audit with universal Rust checking and independent Lean evidence"
keywords = ["rust", "security", "integer-overflow", "lean4", "prove-or-refute"]
authors = [{ name = "LFG Labs" }]

[metadata]
track = "lean-native-symmetric-v3"
difficulty = "expert"
source_language = "rust"
proof_language = "lean4"
vulnerability_class = "CWE-190"
recommended_max_turns = 10

[agent]
# Default Harbor evaluation horizon: --ak max_turns=10 (extended horizon: 25)
timeout_sec = 7200.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
workdir = "/workspace"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = false
